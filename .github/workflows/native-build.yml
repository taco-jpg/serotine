name: Native development builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Without an explicitly configured relay these are offline development packages.
  SEROTINE_RELAY_ORIGIN: ${{ vars.SEROTINE_RELAY_ORIGIN || 'https://native-development.invalid' }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix native/desktop ci --ignore-scripts
      - run: node native/scripts/verify-versions.cjs
      - run: npm run native:build
      - run: npm run native:test
      - run: npx playwright install --with-deps chromium
      - run: npm run native:smoke

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            target: win
            arch: x64
          - os: macos-26
            platform: macos
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix native/desktop ci
      - run: node native/scripts/verify-versions.cjs
      - run: npm run native:build
      - run: npm --prefix native/desktop test
      - name: Package development app without a publisher certificate
        run: npm --prefix native/desktop run package:dev -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node native/scripts/artifact-metadata.cjs native/desktop/dist ${{ matrix.platform }} ${{ matrix.arch }} development
      - uses: actions/upload-artifact@v4
        with:
          name: serotine-development-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            native/desktop/dist/*.exe
            native/desktop/dist/*.dmg
            native/desktop/dist/ARTIFACTS.json
            native/desktop/dist/SHA256SUMS

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm --prefix native/mobile ci
      - run: node native/scripts/verify-versions.cjs
      - run: npm run native:build
      - run: npm --prefix native/mobile test
      - run: npm --prefix native/mobile run sync
      - name: Compile debug APK (Android development certificate)
        working-directory: native/mobile/android
        run: bash gradlew --no-daemon assembleDebug
      - run: node native/scripts/artifact-metadata.cjs native/mobile/android/app/build/outputs/apk/debug android universal development
      - uses: actions/upload-artifact@v4
        with:
          name: serotine-development-android
          if-no-files-found: error
          retention-days: 14
          path: |
            native/mobile/android/app/build/outputs/apk/debug/*.apk
            native/mobile/android/app/build/outputs/apk/debug/ARTIFACTS.json
            native/mobile/android/app/build/outputs/apk/debug/SHA256SUMS

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/mobile/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm --prefix native/mobile ci
      - run: node native/scripts/verify-versions.cjs
      - run: npm run native:build
      - run: npm --prefix native/mobile test
      - run: npm --prefix native/mobile run sync
      - name: Compile for iOS Simulator without signing or distribution
        run: >-
          xcodebuild -project native/mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/serotine-ios-build"
          CODE_SIGNING_ALLOWED=NO build
