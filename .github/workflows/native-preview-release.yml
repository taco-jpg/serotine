name: Publish unsigned native preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-preview-release
  cancel-in-progress: false

env:
  SEROTINE_RELAY_ORIGIN: ${{ vars.SEROTINE_RELAY_ORIGIN || 'https://serotine.peni667.org' }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  preflight:
    name: Preview preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: node native/scripts/verify-versions.cjs
      - run: npm test
      - run: npm run typecheck
      - id: version
        shell: bash
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Preview desktop (${{ matrix.platform }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            target: win
            arch: x64
          - os: macos-26
            platform: macos
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix native/desktop ci
      - run: node native/scripts/verify-versions.cjs
      - run: npm run native:build
      - run: npm --prefix native/desktop test
      - name: Check real Windows startup, backup import, and persistence
        if: matrix.platform == 'windows'
        run: node scripts/native-desktop-smoke.cjs
      - name: Package unsigned preview
        run: npm --prefix native/desktop run package:dev -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node native/scripts/artifact-metadata.cjs native/desktop/dist ${{ matrix.platform }} ${{ matrix.arch }} development
      - uses: actions/upload-artifact@v4
        with:
          name: serotine-preview-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            native/desktop/dist/*.exe
            native/desktop/dist/*.dmg
            native/desktop/dist/ARTIFACTS.json
            native/desktop/dist/SHA256SUMS

  android:
    name: Preview Android
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm --prefix native/mobile ci
      - run: node native/scripts/verify-versions.cjs
      - run: npm run native:build
      - run: npm --prefix native/mobile test
      - run: npm --prefix native/mobile run sync
      - name: Build Android preview APK with development certificate
        working-directory: native/mobile/android
        run: bash gradlew --no-daemon assembleDebug
      - run: node native/scripts/artifact-metadata.cjs native/mobile/android/app/build/outputs/apk/debug android universal development
      - uses: actions/upload-artifact@v4
        with:
          name: serotine-preview-android
          if-no-files-found: error
          retention-days: 14
          path: |
            native/mobile/android/app/build/outputs/apk/debug/*.apk
            native/mobile/android/app/build/outputs/apk/debug/ARTIFACTS.json
            native/mobile/android/app/build/outputs/apk/debug/SHA256SUMS

  publish:
    name: Publish unsigned preview
    needs: [preflight, desktop, android]
    if: needs.preflight.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: serotine-preview-windows-x64
          path: artifacts/windows
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: serotine-preview-macos-arm64
          path: artifacts/macos
      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: serotine-preview-android
          path: artifacts/android
      - name: Normalize public asset names and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t windows < <(find artifacts/windows -type f -name '*.exe' -print)
          mapfile -t macos < <(find artifacts/macos -type f -name '*.dmg' -print)
          mapfile -t android < <(find artifacts/android -type f -name '*.apk' -print)
          test "${#windows[@]}" -eq 1
          test "${#macos[@]}" -eq 1
          test "${#android[@]}" -eq 1
          cp "${windows[0]}" "release-assets/serotine-${VERSION}-preview-windows-x64-unsigned.exe"
          cp "${macos[0]}" "release-assets/serotine-${VERSION}-preview-macos-arm64-unsigned.dmg"
          cp "${android[0]}" "release-assets/serotine-${VERSION}-preview-android-debug.apk"
          (
            cd release-assets
            sha256sum \
              "serotine-${VERSION}-preview-windows-x64-unsigned.exe" \
              "serotine-${VERSION}-preview-macos-arm64-unsigned.dmg" \
              "serotine-${VERSION}-preview-android-debug.apk" \
              > "serotine-${VERSION}-preview-SHA256SUMS.txt"
          )
      - name: Create or update GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}-preview"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Serotine v${VERSION} Preview" \
              --prerelease \
              --notes "Unsigned development preview. Windows and macOS packages are not publisher-signed and may trigger OS security warnings. Android uses a development/debug signing key. These packages use Serotine's development application identity and are intended for testing, not as a production update path. iOS is intentionally omitted because an unsigned iOS build is not a normal installable distribution path."
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
