#:schema node_modules/wrangler/config-schema.json
name = "serotine"
compatibility_date = "2026-05-06"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
main = "custom-worker.ts"

# Workers + Static Assets — serve _next/static/* from .open-next/assets
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Self-reference service binding (required by OpenNext for incremental cache)
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "serotine"

# WebSocket signaling only. Audio/video stays on direct WebRTC connections.
[[durable_objects.bindings]]
name = "CALL_SIGNALING"
class_name = "CallSignalingHub"

[[migrations]]
tag = "v1-call-signaling"
new_sqlite_classes = ["CallSignalingHub"]

[[d1_databases]]
binding = "serotine_db"
database_name = "serotine-db"
database_id = "16f6cdd1-ce00-4562-833a-ec5c533a33b1"

# Encrypted staged file chunks; create this bucket before deploying.
[[r2_buckets]]
binding = "serotine_files"
bucket_name = "serotine-files"
